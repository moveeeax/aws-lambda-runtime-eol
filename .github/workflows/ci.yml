name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.txt ./...
      - name: Build
        run: go build ./...

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build binary
        run: go build -o aws-lambda-runtime-eol .
      - name: Expired runtime trips the CI gate
        run: |
          set +e
          ./aws-lambda-runtime-eol scan --input examples/functions.json --now 2025-07-03 --fail-on high
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 from --fail-on high, got $code"; exit 1
          fi
          echo "gate correctly exited $code"
